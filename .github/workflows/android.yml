name: Android build & release

# Every push and pull request: unit tests + a build check.
# Tag push `v2.1.0` (or "Run workflow" with a version): signed, production-ready ZenNature-<version>-release.apk
# and .aab, attached to a GitHub Release.
#
# Release signing needs these repository secrets (Settings > Secrets and variables > Actions):
#   ZEN_KEYSTORE_BASE64   base64 of the .jks file
#   ZEN_KEYSTORE_PASSWORD store password
#   ZEN_KEY_ALIAS         key alias (zenithan)
#   ZEN_KEY_PASSWORD      key password

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 2.1.0 (creates a GitHub Release v<version>)"
        required: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ZEN_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"; release=true
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            v="${{ github.event.inputs.version }}"; v="${v#v}"; release=true
          else
            v="$(grep -oP 'zenVersionName"\) as String\?\)\?.*?\?: "\K[0-9.]+' app/build.gradle.kts)"; release=false
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version '$v' must look like 2.1.0"; exit 1; }
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $v (release: $release)"

      - name: Fail release without signing key
        if: steps.version.outputs.release == 'true' && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Release builds need the ZEN_KEYSTORE_* repository secrets (see the top of this workflow)."
          exit 1

      - name: Decode signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          ZEN_KEYSTORE_BASE64: ${{ secrets.ZEN_KEYSTORE_BASE64 }}
        run: |
          echo "$ZEN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ZEN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest -PzenVersionName=${{ steps.version.outputs.name }}

      - name: Build signed release APK + AAB
        if: env.HAS_KEYSTORE == 'true'
        env:
          ZEN_KEYSTORE_PASSWORD: ${{ secrets.ZEN_KEYSTORE_PASSWORD }}
          ZEN_KEY_ALIAS: ${{ secrets.ZEN_KEY_ALIAS }}
          ZEN_KEY_PASSWORD: ${{ secrets.ZEN_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease bundleRelease -PzenVersionName=${{ steps.version.outputs.name }}

      - name: Build debug APK (no signing key configured)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::ZEN_KEYSTORE_* secrets are not set, so only a debug APK is built. Add them to get a signed release."
          # assembleRelease still runs (unsigned) so R8/minify problems surface on every PR.
          ./gradlew --stacktrace assembleDebug assembleRelease -PzenVersionName=${{ steps.version.outputs.name }}

      - name: Verify release signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          "$apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)"
          mkdir -p dist
          cp "$apk" dist/
          cp app/build/outputs/bundle/release/*.aab dist/
          cp app/build/outputs/mapping/release/mapping.txt "dist/ZenNature-${{ steps.version.outputs.name }}-mapping.txt"
          ls -la dist

      - name: Collect debug APK
        if: env.HAS_KEYSTORE != 'true'
        run: mkdir -p dist && cp app/build/outputs/apk/debug/*.apk dist/ && ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ZenNature-${{ steps.version.outputs.name }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Zen Nature ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.aab

  screenshots:
    # Renders every screen at 6 device sizes (small phone to tablet landscape) for layout review.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Render screens
        run: ./gradlew --stacktrace testDebugUnitTest -PzenScreenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            app/build/screens/
            app/build/reports/tests/
          if-no-files-found: warn
      - name: Publish screenshots to the ci-screenshots branch (browsable on GitHub)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          [ -d app/build/screens ] || exit 0
          cd app/build/screens
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -name '*.png' | sort | sed 's|^\./||; s|.*|![&](&)|' > README.md
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
