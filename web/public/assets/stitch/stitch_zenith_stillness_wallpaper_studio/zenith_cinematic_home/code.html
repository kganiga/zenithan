<!-- Micro-interactions JavaScript for Museum-grade Stillness -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      // Subtle immersive tap reaction to dismiss chrome for full photograph viewing
      const canvas = document.querySelector('img');
      let isDimmed = false;

      canvas.addEventListener('click', () => {
        isDimmed = !isDimmed;
        const chromeElements = document.querySelectorAll('header, nav, .pt-2, .pb-28');
        chromeElements.forEach(el => {
          el.style.transition = 'opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
          el.style.opacity = isDimmed ? '0.1' : '1';
        });
      });
    });
  </script>
